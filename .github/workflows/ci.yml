name: ci

on:
  push:
    branches: [main]
  pull_request:

# One run per branch; a new push cancels the previous one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/core/package-lock.json

      - name: Install
        working-directory: packages/core
        run: npm ci

      # Runs first: a platform import is a design break, not a test failure.
      - name: Purity check
        working-directory: packages/core
        run: npm run check:purity

      - name: Typecheck
        working-directory: packages/core
        run: npm run typecheck

      - name: Tests
        working-directory: packages/core
        run: npm test

      - name: Build
        working-directory: packages/core
        run: npm run build

  rust:
    name: rust unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.80
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Start the sshd fixture
        run: |
          docker compose -f docker-compose.test.yml up -d --build
          for i in $(seq 1 30); do
            if nc -z 127.0.0.1 22022; then echo "sshd is up"; exit 0; fi
            sleep 2
          done
          echo "sshd did not come up"; docker compose -f docker-compose.test.yml logs; exit 1

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Fails loudly if the fixture is missing, so integration tests can never
      # silently skip in CI the way they may on a developer machine.
      - name: Assert the fixture is reachable
        run: nc -z 127.0.0.1 22022

      - name: Tests
        run: cargo test --workspace -- --nocapture

  # Linux only: the desktop job already builds and exercises this addon on
  # macOS and Windows, so a full matrix here would be the same work twice.
  napi:
    name: napi build (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.80
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: Swatinem/rust-cache@v2
      - name: Build and smoke test
        working-directory: crates/ffi-napi
        run: |
          npm install
          npm run build:debug
          npm test

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.80
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: Swatinem/rust-cache@v2

      # The desktop app depends on both workspace packages.
      - name: Build core
        working-directory: packages/core
        run: npm ci && npm run build

      - name: Build the native addon
        working-directory: crates/ffi-napi
        run: npm ci && npm run build

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm install

      - name: Typecheck
        working-directory: apps/desktop
        run: npm run typecheck

      # Unit tests and build run under Node ABI, so the native module must NOT
      # be rebuilt for Electron yet — that mismatch is what reddens the gate.
      - name: Unit tests
        working-directory: apps/desktop
        run: npm test

      - name: Build
        working-directory: apps/desktop
        run: npm run build

      # Only the smoke test launches Electron and needs the Electron ABI. Rebuild
      # the native module immediately before it, after test and build are done.
      - name: Rebuild native modules for Electron
        working-directory: apps/desktop
        run: npx electron-rebuild -f -w better-sqlite3

      # Electron needs a display; on Linux this would want xvfb, which is why
      # the matrix is macOS and Windows only.
      - name: End-to-end smoke test
        working-directory: apps/desktop
        run: npm run e2e
