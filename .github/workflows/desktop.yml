name: desktop

on:
  push:
    branches: [main]
  pull_request:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.78
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The desktop app depends on both workspace packages.
      - name: Build core
        working-directory: packages/core
        run: npm ci && npm run build

      - name: Build the native addon
        working-directory: crates/ffi-napi
        run: npm ci && npm run build

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm install

      - name: Typecheck
        working-directory: apps/desktop
        run: npm run typecheck

      # Unit tests and build run under Node ABI, so the native module must NOT
      # be rebuilt for Electron yet — that mismatch is what reddens the gate.
      - name: Unit tests
        working-directory: apps/desktop
        run: npm test

      - name: Build
        working-directory: apps/desktop
        run: npm run build

      # Only the smoke test launches Electron and needs the Electron ABI. Rebuild
      # the native module immediately before it, after test and build are done.
      - name: Rebuild native modules for Electron
        working-directory: apps/desktop
        run: npx electron-rebuild -f -w better-sqlite3

      # Electron needs a display; on Linux this would want xvfb, which is why
      # the matrix is macOS and Windows only.
      - name: End-to-end smoke test
        working-directory: apps/desktop
        run: npm run e2e
