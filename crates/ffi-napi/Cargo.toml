[package]
name = "ffi-napi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
ssh-core = { path = "../ssh-core" }
napi = { version = "3", default-features = false, features = ["napi9", "async"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
