#
# CI/test fixture drop-in. OpenSSH 10.3 applies a per-source-IP penalty for
# failed authentication ("srclimit_penalise ... drop connection ... penalty:
# failed authentication"), which blocks the test host for ~15s+ after the
# wrong-password integration test runs. Back-to-back test runs become flaky,
# so we disable the penalty drops entirely and lift MaxStartups so lingering
# mid-handshake aborts never trigger a connection drop either.
#
PerSourcePenalties crash:0 authfail:0 noauth:0 invaliduser:0 grace-exceeded:0 refuseconnection:0
MaxStartups 100:100:100
